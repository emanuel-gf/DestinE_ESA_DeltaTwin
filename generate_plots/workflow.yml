nodes:
  - id: pred_np
    ref: inputs.pred_np
  - id: x_np
    ref: inputs.x_np
  - id: gt_np
    ref: inputs.gt_np
  - id: bands  
    ref: inputs.bands
  - id: generate_plot
    ref: models.generate_plot
  - id: output_b02
    ref : outputs.L2A_B02
  - id: output_b03
    ref : outputs.L2A_B03
  - id: output_b04
    ref : outputs.L2A_B04
  - id: output_tci
