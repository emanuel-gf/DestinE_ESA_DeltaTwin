      port: gt_np
  - from:
      id: bands
    to:
      id: generate_plot
      port: bands ## end of input
  - from:
      id: generate_plot
      port: L2A_B02
    to:
      id: output_b02
  - from:
      id: generate_plot
      port: L2A_B03
    to:
      id: output_b03
  - from:   
      id: generate_plot
      port: L2A_B04
    to:
      id: output_b04
  - from:
      id: generate_plot
      port: L2A_TCI
    to:
      id: output_tci
  - from: 
      id: generate_plot 
      port: metrics
    to:
